name: Android CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  cd:
    name: Build Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            echo "Invalid or nonexistent Git tag: $TAG"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build signed APK
        env:
          TAG: ${{ inputs.tag }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"

          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="$VERSION"

      - name: Verify APK
        run: |
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/release/*.apk)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "No release APK found"
            exit 1
          fi

          ls -lh "${APK_FILES[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ inputs.tag }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --verify-tag \
              --title "Aether $TAG" \
              --generate-notes
          fi

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --clobber

      - name: Cleanup keystore
        if: always()
        run: rm -f release.jks
